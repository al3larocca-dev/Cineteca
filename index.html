<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CineTeca</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff4f6d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f2fb;--sf:#fff;--sf2:#ebe9f8;--tx:#16173a;--mut:#666995;--ac:#ff4f6d;--ac2:#ff8a5c;--line:#e0def2;--glow:#ffd3df80;--sh:#2a237022;
--f1:'Bricolage Grotesque',system-ui,sans-serif;--f2:'Figtree',system-ui,-apple-system,Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11122a;--sf:#1b1d40;--sf2:#26295c;--tx:#eeeeff;--mut:#9b9ecf;--line:#2d3068;--glow:#4b3bb466;--sh:#0006;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11122a;--sf:#1b1d40;--sf2:#26295c;--tx:#eeeeff;--mut:#9b9ecf;--line:#2d3068;--glow:#4b3bb466;--sh:#0006;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f2)}
button{font-family:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:20px 18px 12px;background:radial-gradient(110% 120% at 0 0,var(--glow),transparent 65%),var(--bg)}
h1,h2,.fold b{font-family:var(--f1)}
h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-1.3px;line-height:1}
.sub{color:var(--mut);font-size:14px;margin-top:7px}
.top{display:flex;align-items:flex-start;gap:12px}.grow{flex:1;min-width:0}
.ib{width:44px;height:44px;border:0;border-radius:16px;background:var(--sf);color:var(--tx);display:grid;place-items:center;flex:none;box-shadow:0 2px 10px var(--sh)}
.sb{position:relative;margin-top:18px}.sb svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search{width:100%;padding:14px 16px 14px 44px;border-radius:18px;border:0;background:var(--sf);color:var(--tx);font:inherit;font-size:16px;box-shadow:0 2px 10px var(--sh)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;padding:10px 18px}
.fold{position:relative;height:188px;border:0;border-radius:26px;color:#fff;text-align:left;padding:0 15px 15px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 10px 22px -8px var(--a)}
.fold b{font-size:18px;line-height:1.15;word-break:break-word}.fold span{font-size:13px;opacity:.88;margin-top:3px}
.p{position:absolute;left:50%;top:var(--y);width:66px;aspect-ratio:2/3;transform:translateX(calc(-50% + var(--x))) rotate(var(--r));border-radius:9px;overflow:hidden;background:#ffffff38;display:grid;place-items:center;color:#ffffffb0;box-shadow:0 8px 16px #0005}
.p img{width:100%;height:100%;object-fit:cover;display:block}
.pt{border:0;background:none;padding:0;text-align:left;color:var(--tx);font:inherit}
.cov{position:relative;aspect-ratio:2/3;border-radius:14px;background:var(--sf2);overflow:hidden;box-shadow:0 8px 18px -6px var(--sh),0 2px 5px var(--sh);display:grid;place-items:center;color:var(--mut)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.bd{position:absolute;left:6px;bottom:6px;background:#000b;color:#ffc861;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px}
.pt b{display:block;margin-top:8px;font-size:13px;font-weight:600;line-height:1.25}.pt small{color:var(--mut);font-size:12px}
.empty{text-align:center;color:var(--mut);padding:56px 36px;line-height:1.5}
.empty .ci{width:84px;height:84px;border-radius:50%;background:var(--sf);display:grid;place-items:center;margin:0 auto 18px;color:var(--ac);box-shadow:0 4px 16px var(--sh)}
.empty h3{font:600 20px var(--f1);color:var(--tx);margin:0 0 6px}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:22px;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -4px #ff4f6d88;z-index:6}
.ov{position:fixed;inset:0;background:#0a0a1f99;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:f .15s}
.sh{position:relative;background:var(--bg);width:100%;max-width:480px;max-height:93%;overflow-y:auto;border-radius:30px 30px 0 0;padding:0 20px calc(26px + env(safe-area-inset-bottom,0px));animation:u .24s ease-out}
@keyframes u{from{transform:translateY(70px);opacity:0}}@keyframes f{from{opacity:0}}
.grab{width:42px;height:5px;border-radius:3px;background:#8a8ab088;margin:10px auto 0;position:relative;z-index:2}
.hero{position:relative;margin:-15px -20px 6px;padding:34px 20px 14px;text-align:center;overflow:hidden}
.hero .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.4);opacity:.6}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,var(--bg))}
.hero>*:not(.bg){position:relative;z-index:1}
.big{width:150px;margin:0 auto 18px;border-radius:16px;box-shadow:0 20px 40px -10px #000a}
.sh h2{margin:0;font-size:27px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pill{padding:6px 13px;border-radius:20px;background:var(--sf);font-size:13px;font-weight:600;box-shadow:0 1px 4px var(--sh)}
.stars{font-size:22px;letter-spacing:3px;color:#ffb84d;margin-top:12px}.stars i{font-style:normal;color:var(--line)}
.ro{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.ico{width:40px;height:40px;border-radius:13px;background:var(--sf2);color:var(--ac);display:grid;place-items:center;flex:none}
.lb{font-size:13px;color:var(--mut)}.vl{font-size:16px;margin-top:2px;line-height:1.5}
.btn{width:100%;padding:16px;border-radius:18px;border:0;font-size:16px;font-weight:600;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;margin-top:10px;box-shadow:0 10px 22px -6px #ff4f6d77}
.btn.s{background:var(--sf);color:var(--tx);box-shadow:none}.btn.d{background:none;color:var(--ac);box-shadow:none}
.sh h2.l{text-align:left;padding-top:20px;margin-bottom:6px}
.f label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:16px 0 6px}
.f input,.f textarea,.f select{width:100%;padding:14px;border-radius:14px;border:1.5px solid transparent;background:var(--sf);color:var(--tx);font:inherit;font-size:16px}
.f input:focus,.f textarea:focus,.f select:focus{outline:0;border-color:var(--ac)}
.f textarea{min-height:96px;resize:vertical}
.hd{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:start}.hd label:first-child{margin-top:0}
.pick{border:2px dashed var(--line);background:none;padding:0;border-radius:16px;color:var(--mut);width:100%}
.pick .cov{box-shadow:none;background:none;font-size:12.5px;gap:6px;align-content:center}
.two{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:0;background:var(--sf);color:var(--tx);border-radius:20px;padding:8px 13px;font-size:13px;font-weight:500}
.rt{display:flex;gap:4px}.rt button{border:0;background:none;font-size:34px;line-height:1;padding:2px;color:var(--line)}.rt button.on{color:#ffb84d}
.dots{display:flex;gap:12px;flex-wrap:wrap}.dot{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:20px;font-size:14px;font-weight:500;z-index:40;max-width:85%}
.note{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 6px}
.lkb{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--ac);font-weight:600}
.sr{display:flex;gap:12px;align-items:center;width:100%;border:0;background:var(--sf);color:var(--tx);border-radius:14px;padding:8px;margin-top:8px;text-align:left;font:inherit}
.sr img{width:40px;height:60px;border-radius:6px;object-fit:cover;background:var(--sf2)}.sr small{display:block;color:var(--mut)}
.lk{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:12px;background:var(--ac);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.ti{font:800 22px var(--f1);letter-spacing:-.5px;margin:26px 0 0}.sg{font:600 15px var(--f2);color:var(--mut);margin:20px 0 6px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 0 10px}.strip .pt{width:100px;flex:none}
.rk{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--tx);font:inherit;font-size:15px;text-align:left}.rk small{display:block}
.n{width:28px;height:28px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;font-size:13px;flex:none}.th{width:40px;border-radius:8px;flex:none;box-shadow:none}.mu{color:var(--mut);font-size:13px}
.sbr{display:flex;gap:10px;align-items:center;margin-top:18px}.sbr .sb{margin:0;flex:1}.sortb{width:50px;height:50px;border-radius:18px}.sortb.on{background:var(--ac);color:#fff}
.so{padding:16px 0;font-size:16px}.ck{color:var(--ac);font-size:18px}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const I={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',tv:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',text:'<path d="M5 6h14M5 12h14M5 18h9"/>',gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',trophy:'<path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 14v4M8 21h8"/>',sort:'<path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const FC=[['#5b4bff','#9a6bff'],['#ff4f6d','#ff8a5c'],['#12b5a6','#4ddc9a'],['#f2a31b','#ffd166'],['#2f80ed','#56ccf2'],['#d13fbf','#ff7ad9']];
const PLAT=['Netflix','Prime Video','Disney+','NOW','Apple TV+','Paramount+','RaiPlay','Blu-ray/DVD'];
const grad=c=>{const p=FC.find(x=>x[0]===c);return p?[p[0],p[1]]:[c,c+'cc']};
let db={folders:[],movies:[]},st={fid:null,q:'',sort:'ins'},tmp=null,pushed=false,onYes=null;
try{const r=localStorage.getItem('cineteca');if(r)db=JSON.parse(r)}catch(e){}
try{const so=localStorage.getItem('cineteca_sort');if(['ins','ya','yd','sa','sd','dir'].includes(so))st.sort=so}catch(e){}
function save(){try{localStorage.setItem('cineteca',JSON.stringify(db))}catch(e){toast('Memoria piena: usa copertine più piccole')}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const fo=id=>db.folders.find(f=>f.id===id),mv=id=>db.movies.find(m=>m.id===id);
const cnt=id=>db.movies.filter(m=>m.fid===id).length;
const stars=n=>'★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i>';
const poster=m=>`<button class="pt" onclick="openMovie('${m.id}')"><div class="cov">${m.cover?`<img src="${m.cover}" alt="">`:ic('film',30)}${m.rating?`<span class="bd">★ ${m.rating}</span>`:''}</div><b>${esc(m.title)}</b>${m.year?`<small>${esc(m.year)}</small>`:''}</button>`;
function match(m){const q=st.q.toLowerCase();return !q||[m.title,m.director,m.genre,m.year].join(' ').toLowerCase().includes(q)}
const search=ph=>`<div class="sb">${ic('search',20)}<input class="search" type="search" placeholder="${ph}" value="${esc(st.q)}" oninput="st.q=this.value;render(true)"></div>`;
function fan(f){const ms=db.movies.filter(x=>x.fid===f.id).slice(-3).reverse();
  return [[0,0,14,2],[-40,-10,28,1],[40,10,28,1]].map((p,i)=>{const m=ms[i];return `<i class="p" style="--x:${p[0]}px;--r:${p[1]}deg;--y:${p[2]}px;z-index:${p[3]}">${m&&m.cover?`<img src="${m.cover}" alt="">`:ic('film',20)}</i>`}).join('')}
const emptyBox=(i,t,s)=>`<div class="empty"><div class="ci">${ic(i,36)}</div><h3>${t}</h3>${s}</div>`;

function render(keep){
  let h='';
  if(!st.fid){
    const res=st.q?db.movies.filter(match):[];
    h=`<header><div class="top"><div class="grow"><h1>CineTeca</h1><div class="sub">${db.movies.length} film in ${db.folders.length} cartelle</div></div><button class="ib" onclick="rank()" aria-label="Classifiche">${ic('trophy')}</button><button class="ib" onclick="backup()" aria-label="Impostazioni">${ic('gear')}</button></div>${search('Cerca un film…')}</header>`;
    if(st.q)h+=res.length?`<div class="g3">${res.map(poster).join('')}</div>`:emptyBox('search','Nessun risultato','Prova con un altro titolo o regista.');
    else if(!db.folders.length)h+=emptyBox('folder','Crea la prima cartella','Tocca + e dai un nome, per esempio “Thriller” o “Da rivedere”.');
    else h+=`<div class="g2">${db.folders.map(f=>{const g=grad(f.color);return `<button class="fold" style="--a:${g[0]};--b:${g[1]}" onclick="openFolder('${f.id}')">${fan(f)}<b>${esc(f.name)}</b><span>${cnt(f.id)} film</span></button>`}).join('')}</div>`;
    h+=`<button class="fab" onclick="folderForm()" aria-label="Nuova cartella">${ic('plus',30)}</button>`;
  }else{
    const f=fo(st.fid),ms=sortMovies(db.movies.filter(m=>m.fid===f.id&&match(m)));
    h=`<header><div class="top"><button class="ib" onclick="goHome()" aria-label="Indietro">${ic('back')}</button><div class="grow"><h1 style="font-size:28px">${esc(f.name)}</h1><div class="sub">${cnt(f.id)} film${st.sort!=='ins'?' · '+SORTS[st.sort]:''}</div></div><button class="ib" onclick="folderForm('${f.id}')" aria-label="Modifica cartella">${ic('edit',20)}</button></div><div class="sbr">${search('Cerca in questa cartella…')}<button class="ib sortb${st.sort!=='ins'?' on':''}" onclick="sortSheet()" aria-label="Ordina">${ic('sort',22)}</button></div></header>`;
    h+=ms.length?`<div class="g3">${ms.map(poster).join('')}</div>`:(st.q?emptyBox('search','Nessun risultato','Prova con un altro titolo.'):emptyBox('film','Cartella vuota','Tocca + per aggiungere il primo film.'));
    h+=`<button class="fab" onclick="movieForm()" aria-label="Aggiungi film">${ic('plus',30)}</button>`;
  }
  $('#app').innerHTML=h;
  if(keep){const s=$('.search');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length)}}
}
function openFolder(id){st.fid=id;st.q='';try{history.pushState({f:1},'');pushed=true}catch(e){}render();scrollTo(0,0)}
function goHome(){if(pushed){pushed=false;try{history.back();return}catch(e){}}st.fid=null;st.q='';render()}
onpopstate=()=>{if($('.ov'))closeSheet();else{pushed=false;st.fid=null;st.q='';render()}};

function sheet(html){closeSheet();const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="sh"><div class="grab"></div>${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d)}
function closeSheet(){document.querySelectorAll('.ov').forEach(o=>o.remove())}
function ask(msg,yes){onYes=yes;sheet(`<h2 class="l">${msg}</h2><p class="note">L’azione non si può annullare.</p><button class="btn" onclick="onYes();closeSheet()">Elimina</button><button class="btn s" onclick="closeSheet()">Annulla</button>`)}
const row=(i,l,v,x='')=>`<div class="ro"><div class="ico">${ic(i,20)}</div><div><div class="lb">${l}</div><div class="vl">${v?esc(v):(x?'':'—')}${x?`<div>${x}</div>`:''}</div></div></div>`;

function openMovie(id){
  const m=mv(id),f=fo(m.fid),g=f?grad(f.color):['#5b4bff','#9a6bff'];
  sheet(`<div class="hero"><div class="bg" style="background-image:${m.cover?`url(${m.cover})`:`linear-gradient(135deg,${g[0]},${g[1]})`}"></div>
  <div class="cov big">${m.cover?`<img src="${m.cover}" alt="">`:ic('film',40)}</div>
  <h2>${esc(m.title)}</h2>
  <div class="pills">${m.year?`<span class="pill">${esc(m.year)}</span>`:''}${m.genre?`<span class="pill">${esc(m.genre)}</span>`:''}</div>
  ${m.rating?`<div class="stars">${stars(m.rating)}</div>`:''}</div>
  ${row('user','Regista',m.director)}${row('text','Trama',m.desc)}${row('tv','Dove vederlo',m.where,/^https?:\/\//.test(m.link||'')?`<a class="lk" href="${esc(m.link)}" target="_blank" rel="noopener">Apri il link</a>`:'')}${row('folder','Cartella',f&&f.name)}<div id="sg"></div>
  <button class="btn" onclick="movieForm('${m.id}')">Modifica informazioni</button>
  <button class="btn d" onclick="ask('Eliminare questo film?',()=>{db.movies=db.movies.filter(x=>x.id!=='${m.id}');save();render()})">Elimina film</button>`);
  suggest(m);
}

function movieForm(id){
  const m=id?mv(id):{fid:st.fid};tmp={cover:m.cover||'',rating:m.rating||0,tmdb:m.tmdb||0,gids:m.gids||[],dir:m.dir||0};
  sheet(`<h2 class="l">${id?'Modifica film':'Nuovo film'}</h2><div class="f">
  <div class="hd"><div><button class="pick" onclick="$('#file').click()"><div class="cov" id="pv">${tmp.cover?`<img src="${tmp.cover}" alt="">`:`${ic('img',28)}Copertina`}</div></button><input type="file" id="file" accept="image/*" hidden onchange="pickCover(this)"></div>
  <div><label>Titolo *</label><input id="t" value="${esc(m.title)}" placeholder="Es. Il padrino"><label>Regista</label><input id="d" value="${esc(m.director)}"></div></div>
  <button class="chip lkb" onclick="webSearch()">${ic('search',16)} Cerca online e compila</button><div id="sr"></div><div class="two"><div><label>Anno</label><input id="y" inputmode="numeric" maxlength="4" value="${esc(m.year)}"></div><div><label>Genere</label><input id="g" value="${esc(m.genre)}" placeholder="Drammatico"></div></div>
  <label>Breve descrizione</label><textarea id="s">${esc(m.desc)}</textarea>
  <label>Dove vederlo</label><input id="w" value="${esc(m.where)}" placeholder="Es. Netflix">
  <div class="chips">${PLAT.map(p=>`<button class="chip" onclick="$('#w').value='${p}'">${p}</button>`).join('')}</div>
  <label>Link per vederlo</label><input id="l" type="url" inputmode="url" value="${esc(m.link)}" placeholder="https://…"><label>Cartella</label><select id="c">${db.folders.map(f=>`<option value="${f.id}" ${f.id===m.fid?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
  <label>Il tuo voto</label><div class="rt" id="r"></div></div>
  <button class="btn" onclick="saveMovie('${id||''}')">Salva film</button><button class="btn s" onclick="closeSheet()">Annulla</button>`);
  paint();
}
function paint(){$('#r').innerHTML=[1,2,3,4,5].map(n=>`<button class="${n<=tmp.rating?'on':''}" onclick="tmp.rating=tmp.rating===${n}?0:${n};paint()" aria-label="${n} stelle">★</button>`).join('')}
function pickCover(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmp.cover=c.toDataURL('image/jpeg',.8);$('#pv').innerHTML=`<img src="${tmp.cover}" alt="">`};im.src=rd.result};rd.readAsDataURL(f);
}
function saveMovie(id){
  const t=$('#t').value.trim();if(!t){toast('Inserisci il titolo');return}
  if(!$('#c').value){toast('Crea prima una cartella');return}
  const o={title:t,director:$('#d').value.trim(),year:$('#y').value.trim(),genre:$('#g').value.trim(),desc:$('#s').value.trim(),where:$('#w').value.trim(),fid:$('#c').value,cover:tmp.cover,rating:tmp.rating,link:$('#l').value.trim(),tmdb:tmp.tmdb,gids:tmp.gids,dir:tmp.dir};
  if(id)Object.assign(mv(id),o);else db.movies.push({id:uid(),...o});
  save();closeSheet();render();if(id)openMovie(id);
}

function folderForm(id){
  const f=id?fo(id):{name:'',color:FC[db.folders.length%FC.length][0]};tmp={color:f.color};
  sheet(`<h2 class="l">${id?'Modifica cartella':'Nuova cartella'}</h2><div class="f"><label>Nome</label><input id="n" value="${esc(f.name)}" placeholder="Es. Thriller, Da rivedere…">
  <label>Colore</label><div class="dots">${FC.map(c=>`<button class="dot" data-c="${c[0]}" style="background:linear-gradient(135deg,${c[0]},${c[1]});border-color:${c[0]===f.color?'var(--tx)':'transparent'}" onclick="tmp.color='${c[0]}';document.querySelectorAll('.dot').forEach(x=>x.style.borderColor=x.dataset.c===tmp.color?'var(--tx)':'transparent')" aria-label="Colore"></button>`).join('')}</div></div>
  <button class="btn" onclick="saveFolder('${id||''}')">Salva cartella</button>${id?`<button class="btn d" onclick="ask('Eliminare la cartella e i suoi film?',()=>{db.movies=db.movies.filter(m=>m.fid!=='${id}');db.folders=db.folders.filter(x=>x.id!=='${id}');save();st.fid=null;render()})">Elimina cartella</button>`:''}`);
}
function saveFolder(id){
  const n=$('#n').value.trim();if(!n){toast('Inserisci un nome');return}
  if(id){const f=fo(id);f.name=n;f.color=tmp.color}else db.folders.push({id:uid(),name:n,color:tmp.color});
  save();closeSheet();render();
}

const I92='https://image.tmdb.org/t/p/w92',IMG='https://image.tmdb.org/t/p/w342';
const TK=()=>{try{return localStorage.getItem('cineteca_tmdb')||''}catch(e){return ''}};
function setTk(v){try{localStorage.setItem('cineteca_tmdb',v.trim())}catch(e){}}
async function tm(path,p={}){
  const k=TK();if(!k){toast('Inserisci prima la chiave TMDB in Impostazioni');throw 0}
  const u=new URL('https://api.themoviedb.org/3'+path);u.searchParams.set('language','it-IT');
  for(const x in p)u.searchParams.set(x,p[x]);
  const o={};if(k.length>60)o.headers={Authorization:'Bearer '+k};else u.searchParams.set('api_key',k);
  let r;try{r=await fetch(u,o)}catch(e){toast('Nessuna connessione');throw 0}
  if(!r.ok){toast('Chiave TMDB non valida');throw 0}return r.json();
}
const dirOf=d=>((d.credits&&d.credits.crew)||[]).find(c=>c.job==='Director');
async function webSearch(){
  const q=$('#t').value.trim();if(!q){toast('Scrivi prima il titolo');return}
  const sr=$('#sr');sr.innerHTML='<p class="note">Cerco…</p>';
  try{const d=await tm('/search/movie',{query:q,include_adult:'false'});
  sr.innerHTML=d.results.slice(0,6).map(r=>`<button class="sr" onclick="pickTmdb(${r.id})"><img src="${r.poster_path?I92+r.poster_path:''}" alt=""><span><b>${esc(r.title)}</b><small>${esc((r.release_date||'').slice(0,4))}</small></span></button>`).join('')||'<p class="note">Nessun risultato</p>'}catch(e){sr.innerHTML=''}
}
async function pickTmdb(id){
  try{const d=await tm('/movie/'+id,{append_to_response:'credits,watch/providers'});
  const dr=dirOf(d),it=((d['watch/providers']||{}).results||{}).IT||{},pv=(it.flatrate||[]).map(p=>p.provider_name),gn=d.genres||[];
  tmp.cover=d.poster_path?IMG+d.poster_path:tmp.cover;tmp.tmdb=d.id;tmp.gids=gn.map(g=>g.id);tmp.dir=dr?dr.id:0;
  const set=(i,v)=>{if(v)$(i).value=v};
  set('#t',d.title);set('#d',dr&&dr.name);set('#y',(d.release_date||'').slice(0,4));set('#g',gn.slice(0,2).map(g=>g.name).join(', '));set('#s',d.overview);set('#w',pv.slice(0,3).join(', '));set('#l',it.link);
  $('#pv').innerHTML=tmp.cover?`<img src="${tmp.cover}" alt="">`:ic('img',28);$('#sr').innerHTML='';toast('Dati compilati: controlla e salva');
  }catch(e){}
}
async function suggest(m){
  const el=$('#sg');if(!TK()||!el)return;
  try{
    if(!m.tmdb){const p={query:m.title};if(m.year)p.year=m.year;const r=(await tm('/search/movie',p)).results[0];if(!r)return;
      const d=await tm('/movie/'+r.id,{append_to_response:'credits'}),dr=dirOf(d);m.tmdb=d.id;m.gids=(d.genres||[]).map(g=>g.id);m.dir=dr?dr.id:0;save()}
    const none={results:[]},have=new Set(db.movies.map(x=>x.tmdb));
    const [a,b]=await Promise.all([m.gids&&m.gids.length?tm('/discover/movie',{with_genres:m.gids.slice(0,2).join(','),sort_by:'vote_average.desc','vote_count.gte':1000}):none,m.dir?tm('/discover/movie',{with_crew:m.dir,sort_by:'popularity.desc'}):none]);
    const strip=(t,l)=>{const r=l.results.filter(x=>x.id!==m.tmdb&&!have.has(x.id)&&x.poster_path).slice(0,10);return r.length?`<h3 class="sg">${t}</h3><div class="strip">${r.map(x=>`<button class="pt" onclick="addTm(${x.id})"><div class="cov"><img src="${IMG+x.poster_path}" alt=""></div><b>${esc(x.title)}</b></button>`).join('')}</div>`:''};
    const h=strip('Dello stesso genere',a)+strip('Dello stesso regista',b);
    if(h&&$('#sg')===el)el.innerHTML='<h2 class="ti">Ti potrebbero interessare</h2>'+h;
  }catch(e){}
}
function addTm(id){closeSheet();movieForm();pickTmdb(id)}
function rank(){
  const top=db.movies.filter(m=>m.rating).sort((a,b)=>b.rating-a.rating||a.title.localeCompare(b.title)).slice(0,10);
  const tally=k=>{const c={};db.movies.forEach(m=>String(m[k]||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(v=>c[v]=(c[v]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5)};
  const tl=(t,a)=>a.length?`<h3 class="sg">${t}</h3>${a.map((x,i)=>`<div class="rk"><b class="n">${i+1}</b><span class="grow">${esc(x[0])}</span><span class="mu">${x[1]} film</span></div>`).join('')}`:'';
  sheet(`<h2 class="l">Classifiche</h2>`+(top.length?`<h3 class="sg">I tuoi film migliori</h3>${top.map((m,i)=>`<button class="rk" onclick="openMovie('${m.id}')"><b class="n">${i+1}</b><div class="cov th">${m.cover?`<img src="${m.cover}" alt="">`:''}</div><span class="grow">${esc(m.title)}<small class="mu">${esc(m.year)}</small></span><span class="mu">★ ${m.rating}</span></button>`).join('')}`:'<p class="note">Dai un voto ai tuoi film per vedere la classifica.</p>')+tl('Registi più visti',tally('director'))+tl('Generi più visti',tally('genre')));
}
const SORTS={ins:'Predefinito (ordine di inserimento)',ya:'Anno: dal più vecchio',yd:'Anno: dal più recente',sa:'Stelle: dalla più bassa',sd:'Stelle: dalla più alta',dir:'Regista: dalla A alla Z'};
function sortMovies(l){
  const k=SORTS[st.sort]?st.sort:'ins',a=l.slice();if(k==='ins')return a;
  const f={ya:m=>+m.year,yd:m=>+m.year,sa:m=>m.rating,sd:m=>m.rating,dir:m=>(m.director||'').trim().toLowerCase()}[k],dsc=k==='yd'||k==='sd';
  return a.sort((p,q)=>{const x=f(p),y=f(q),nx=!x,ny=!y;
    if(nx||ny)return (nx-ny)||p.title.localeCompare(q.title,'it');
    const c=typeof x==='string'?x.localeCompare(y,'it'):x-y;return (dsc?-c:c)||p.title.localeCompare(q.title,'it')});
}
function sortSheet(){sheet(`<h2 class="l">Ordina i film</h2>${Object.keys(SORTS).map(k=>`<button class="rk so" onclick="setSort('${k}')"><span class="grow">${SORTS[k]}</span>${st.sort===k?'<b class="ck">✓</b>':''}</button>`).join('')}`)}
function setSort(k){st.sort=k;try{localStorage.setItem('cineteca_sort',k)}catch(e){}closeSheet();render()}
function backup(){
  sheet(`<h2 class="l">Impostazioni</h2><div class="f"><label>Chiave TMDB per cercare i film online</label><input id="tk" value="${esc(TK())}" placeholder="Incolla qui la tua chiave" oninput="setTk(this.value)"></div><p class="note" style="margin-top:8px">Gratis su themoviedb.org: Impostazioni, poi API. I dati dei film arrivano da TMDB, servizio non approvato né certificato da TMDB.</p><h2 class="l" style="font-size:20px;padding-top:14px">Backup</h2><p class="note">Copia i tuoi dati e conservali, per esempio in una nota. Per ripristinarli incollali qui sotto.</p>
  <div class="f"><textarea id="bk" placeholder="Incolla qui il backup da ripristinare"></textarea></div>
  <button class="btn" onclick="copyBk()">Copia backup</button><button class="btn s" onclick="restoreBk()">Ripristina dal testo incollato</button>`);
}
function copyBk(){const s=JSON.stringify(db);try{navigator.clipboard.writeText(s).then(()=>toast('Backup copiato'),()=>fb(s))}catch(e){fb(s)}}
function fb(s){const t=$('#bk');t.value=s;t.select();toast('Copia il testo selezionato')}
function restoreBk(){try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.folders)||!Array.isArray(d.movies))throw 0;db=d;save();closeSheet();st.fid=null;st.q='';render();toast('Dati ripristinati')}catch(e){toast('Backup non valido')}}
render();
</script></body></html>
